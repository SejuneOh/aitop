name: ci

# main 대상 PR 은 release-pr 워크플로가 만드는 dev -> main 릴리스 PR 뿐이라 pull_request 로 돌리지 않는다.
# 봇(github-actions[bot])이 연 PR 의 실행은 첫 기여자 승인 대기(action_required)로 멈췄다가 PR 이 닫히면
# job 0개 실패로 남는다. 같은 커밋은 dev 푸시 때 여기서 검사하고, 그 결과가 릴리스 PR 화면에도 보인다.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # 22.13.0 은 node:sqlite 는 있지만 file: 주소를 열지 못해 agy 를 프로세스만으로 보여야 하고, 22.15.0 부터 열 수 있다.
        node: [22, 22.13.0, 22.15.0, 24]
        # macOS 는 ps·lsof 로 프로세스를 찾는다. 가상 터미널 e2e 는 util-linux script 가 없어 건너뛴다.
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: 단위 테스트
        run: npm test
      # 실제 bin 을 실행한다: --json/--once/--help 와, 가상 터미널(script)에서 키 입력·종료 확인
      - name: e2e 테스트
        run: npm run test:e2e
        timeout-minutes: 5
      - name: 실행 확인 (세션 없는 환경)
        run: node bin/aitop.mjs --once > /dev/null
      # 배포될 tarball 을 임시 prefix 에 설치해 실행한다. package.json 의 files 에 필요한 폴더가 빠지면 여기서 실패한다.
      - name: 설치 확인 (npm pack)
        shell: bash
        run: |
          set -euo pipefail
          PACK="$RUNNER_TEMP/pack"
          PREFIX="$RUNNER_TEMP/p"
          rm -rf "$PACK" "$PREFIX"
          mkdir -p "$PACK"
          npm pack --pack-destination "$PACK"
          npm i -g --prefix "$PREFIX" "$PACK"/*.tgz
          EXPECTED=$(node -p "require('./package.json').version")
          cd "$RUNNER_TEMP"
          GOT=$("$PREFIX/bin/aitop" --version)
          echo "aitop --version: $GOT"
          test "$GOT" = "$EXPECTED"
          "$PREFIX/bin/aitop" --once > /dev/null

  # 영어 기본 경로: AITOP_LANG 없이 LANG=C 에서 언어 고르기, 영어 실시간 화면(표·상세·도움말, 폭·높이별 넘침)과 --help·--doctor·--once·오류를 본다.
  # npm test 는 AITOP_LANG=ko 로 고정돼 있어 여기서는 쓰지 않고, 영어 테스트와 bin 을 직접 실행한다.
  english:
    runs-on: ubuntu-latest
    env:
      LANG: C
      LC_ALL: ''
      LC_MESSAGES: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 영어 테스트 (LANG=C, AITOP_LANG 없음)
        shell: bash
        run: |
          unset AITOP_LANG
          node --test test/i18n.test.mjs test/english-screen.test.mjs
      # 한글이 섞이면 실패한다. LANG=C 의 grep 은 UTF-8 범위를 못 다루므로 node 로 본다.
      # 러너에는 세션 기록이 없으므로 --once 는 빈 화면(점검 줄)을 영어로 낸다.
      - name: 영어 --help·--doctor·--once·모르는 옵션 확인
        shell: bash
        run: |
          set -euo pipefail
          unset AITOP_LANG
          noko() { node -e 'const s=require("fs").readFileSync(0,"utf8"); if (/[가-힣]/.test(s)) { console.error(s); process.exit(1); }'; }
          node bin/aitop.mjs --help > help.txt
          grep -q 'print the current state once and exit' help.txt
          noko < help.txt
          node bin/aitop.mjs --doctor > doctor.txt
          grep -q 'setup check' doctor.txt
          noko < doctor.txt
          COLUMNS=100 LINES=30 node bin/aitop.mjs --once > once.txt
          grep -q 'read-only' once.txt
          noko < once.txt
          code=0
          node bin/aitop.mjs --nope 2> err.txt || code=$?
          test "$code" = 2
          head -1 err.txt | grep -qx 'aitop: unknown option --nope'
          noko < err.txt

  # Windows 네이티브 1단계 (#194): 배포 tarball 을 설치해(package.json 의 os, aitop.cmd 실행 파일) 임시 기록으로 돌려 본다.
  # test/smoke.mjs 가 CLAUDE_CONFIG_DIR·CODEX_HOME·XDG_* 를 임시 폴더로 바꾸므로 러너의 실제 홈은 읽지 않는다.
  # 프로세스 감지·알림·--on-waiting 은 아직이라(#195-#197) 단위 테스트와 e2e 는 실패 목록을 모으는 용도로 두고 작업을 막지 않는다.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: 설치 확인 (npm pack, npm i -g)
        shell: pwsh
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'pack'
          $prefix = Join-Path $env:RUNNER_TEMP 'p'
          New-Item -ItemType Directory -Force $pack | Out-Null
          npm pack --pack-destination $pack
          if ($LASTEXITCODE) { exit 1 }
          $tgz = (Get-ChildItem $pack -Filter *.tgz).FullName
          npm i -g --prefix $prefix $tgz
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path (Join-Path $prefix 'aitop.cmd'))) { throw 'aitop.cmd 가 없다' }
          Add-Content $env:GITHUB_PATH $prefix
      # npm 이 만든 aitop.cmd 를 cmd.exe 에서 부른다.
      - name: aitop --version (cmd.exe)
        shell: cmd
        run: aitop --version
      # 설치한 aitop 을 부른다. 버전이 package.json 과 같은지, Claude·Codex 세션이 보이는지, 기본 폴더가 %LOCALAPPDATA%·%APPDATA% 인지 본다.
      - name: 실행 확인 (--help·--doctor·--once·--json·--report daily, 임시 기록)
        shell: bash
        run: node test/smoke.mjs
      - name: 단위 테스트
        run: npm test
        continue-on-error: true
      - name: e2e 테스트
        run: npm run test:e2e
        timeout-minutes: 5
        continue-on-error: true
