name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        # macOS 는 ps·lsof 로 프로세스를 찾는다. 가상 터미널 e2e 는 util-linux script 가 없어 건너뛴다.
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 단위 테스트
        run: npm test
      # 실제 bin 을 실행한다: --json/--once/--help 와, 가상 터미널(script)에서 키 입력·종료 확인
      - name: e2e 테스트
        run: npm run test:e2e
        timeout-minutes: 5
      - name: 실행 확인 (세션 없는 환경)
        run: node bin/aitop.mjs --once > /dev/null
