name: ci

# main 대상 PR 은 release-pr 워크플로가 만드는 dev -> main 릴리스 PR 뿐이라 pull_request 로 돌리지 않는다.
# 봇(github-actions[bot])이 연 PR 의 실행은 첫 기여자 승인 대기(action_required)로 멈췄다가 PR 이 닫히면
# job 0개 실패로 남는다. 같은 커밋은 dev 푸시 때 여기서 검사하고, 그 결과가 릴리스 PR 화면에도 보인다.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # 22.13.0 은 node:sqlite 는 있지만 file: 주소를 열지 못해 agy 를 프로세스만으로 보여야 하고, 22.15.0 부터 열 수 있다.
        node: [22, 22.13.0, 22.15.0, 24]
        # macOS 는 ps·lsof 로 프로세스를 찾는다. 가상 터미널 e2e 는 util-linux script 가 없어 건너뛴다.
        include:
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: 단위 테스트
        run: npm test
      # 실제 bin 을 실행한다: --json/--once/--help 와, 가상 터미널(script)에서 키 입력·종료 확인
      - name: e2e 테스트
        run: npm run test:e2e
        timeout-minutes: 5
      - name: 실행 확인 (세션 없는 환경)
        run: node bin/aitop.mjs --once > /dev/null
      # 배포될 tarball 을 임시 prefix 에 설치해 실행한다. package.json 의 files 에 필요한 폴더가 빠지면 여기서 실패한다.
      - name: 설치 확인 (npm pack)
        shell: bash
        run: |
          set -euo pipefail
          PACK="$RUNNER_TEMP/pack"
          PREFIX="$RUNNER_TEMP/p"
          rm -rf "$PACK" "$PREFIX"
          mkdir -p "$PACK"
          npm pack --pack-destination "$PACK"
          npm i -g --prefix "$PREFIX" "$PACK"/*.tgz
          EXPECTED=$(node -p "require('./package.json').version")
          cd "$RUNNER_TEMP"
          GOT=$("$PREFIX/bin/aitop" --version)
          echo "aitop --version: $GOT"
          test "$GOT" = "$EXPECTED"
          "$PREFIX/bin/aitop" --once > /dev/null
