# dev 에 새 커밋이 들어오면 dev -> main release PR 을 만들거나 갱신한다 (.github/release-pr.sh).
# Actions 토큰으로 만든 PR 에서도 pull_request 실행은 생기지만, 첫 기여자 승인 대기(action_required)로 멈췄다가
# PR 이 닫히면 job 0개 실패로 남는다. 그래서 ci.yml 은 main 대상 PR 에서 돌지 않는다.
# 같은 커밋은 dev 푸시 때 ci.yml 이 검사하고(릴리스 PR 화면에 그 결과가 보인다),
# main 병합 뒤 release.yml 이 배포 전에 단위·e2e 테스트를 다시 돌린다.
# 저장소 설정 "Allow GitHub Actions to create and approve pull requests" 가 켜져 있어야 한다.
name: release-pr

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency: release-pr

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: release PR 만들기 또는 갱신
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/release-pr.sh
